# ---------------------------------------------------------------------------
# Alerts (scheduled every 5 minutes, results appear under Activity > Triggered Alerts)
# Note: scheduled alerts need the Enterprise trial or a paid license; Splunk Free
# does not run them.
# ---------------------------------------------------------------------------

[Alert - Gateway 5xx error rate above 5%]
description = More than 5% of requests through the gateway failed with 5xx in the last 5 minutes.
search = `gateway` \
| stats count AS total, sum(is_error) AS errors \
| eval error_pct = round(errors / total * 100, 2) \
| where total > 50 AND error_pct > 5
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 15m
alert.digest_mode = 1

[Alert - Payment provider failures]
description = A payment provider is returning repeated errors (likely provider outage).
search = `app_logs` service="payment-service" status>=500 \
| stats count AS failures, latest(error) AS last_error BY provider \
| where failures > 10
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.fields = provider
alert.suppress.period = 30m
alert.digest_mode = 0

[Alert - Possible brute-force login]
description = A single IP had more than 20 failed logins in 5 minutes.
search = `app_logs` service="auth-service" event="login" outcome="failure" \
| stats count AS failed_logins, dc(user) AS users_tried, values(user) AS usernames BY client_ip \
| where failed_logins > 20 \
| sort - failed_logins
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = client_ip
alert.suppress.period = 1h
alert.digest_mode = 0

[Alert - Slow responses (p95 above 1s)]
description = p95 latency of a service is above 1 second over the last 10 minutes.
search = `app_logs` service!="web-gateway" duration_ms=* \
| stats count, perc95(duration_ms) AS p95_ms BY service \
| where count > 30 AND p95_ms > 1000 \
| eval p95_ms = round(p95_ms)
dispatch.earliest_time = -10m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.suppress = 1
alert.suppress.fields = service
alert.suppress.period = 30m
alert.digest_mode = 0

[Alert - Log pipeline stopped]
description = No events received for 10 minutes: the collector, HEC or the apps may be down. Monitoring the monitoring.
search = | tstats count WHERE index=app_logs earliest=-10m latest=now \
| where count == 0
dispatch.earliest_time = -10m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 30m
alert.digest_mode = 1

# ---------------------------------------------------------------------------
# Reports (run on demand from Search & Reporting > Reports)
# ---------------------------------------------------------------------------

[Report - Top failing endpoints (24h)]
search = `gateway` status>=500 \
| stats count AS errors, values(status) AS statuses BY method, path \
| sort - errors
dispatch.earliest_time = -24h
dispatch.latest_time = now

[Report - Availability by service (24h)]
description = Percentage of successful (non-5xx) requests per service, an SLI view from logs.
search = `app_logs` service!="web-gateway" status=* \
| stats count AS total, sum(is_error) AS errors BY service \
| eval availability_pct = round((total - errors) / total * 100, 3) \
| sort availability_pct
dispatch.earliest_time = -24h
dispatch.latest_time = now
