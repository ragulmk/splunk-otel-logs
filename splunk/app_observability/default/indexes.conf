# Dedicated index for application logs: separate retention and access control
[app_logs]
homePath   = $SPLUNK_DB/app_logs/db
coldPath   = $SPLUNK_DB/app_logs/colddb
thawedPath = $SPLUNK_DB/app_logs/thaweddb
# Keep 7 days, cap at 2 GB (whichever comes first)
frozenTimePeriodInSecs = 604800
maxTotalDataSizeMB = 2048
