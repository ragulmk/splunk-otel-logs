# Events arrive through HEC from the OpenTelemetry Collector with the timestamp
# already set, so only search-time field extraction is needed.
[app:json]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 20000
# Normalised helper fields used by dashboards and alerts
EVAL-is_error  = if(tonumber(status) >= 500 OR level == "ERROR", 1, 0)
EVAL-is_slow   = if(tonumber(duration_ms) > 1000, 1, 0)
EVAL-status_class = case(tonumber(status) >= 500, "5xx", tonumber(status) >= 400, "4xx", tonumber(status) >= 300, "3xx", tonumber(status) >= 200, "2xx", true(), "other")
FIELDALIAS-src = client_ip AS src
